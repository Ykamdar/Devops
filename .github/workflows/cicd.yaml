
  name: cicd
  on:
    workflow_dispatch:
  jobs:
    create-file:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2     
              with: 
                terraform_wrapper: false
            - name: Terraform apply
              id:   Apply
              run: |
                terraform init
                terraform validate
                terraform plan
                terraform apply -auto-approve
